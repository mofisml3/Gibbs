document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

e: #4a6fa5;\n  --blue-soft: #e3ecf7;\n  --gold: #c9a44a;\n  --danger: #b3493d;\n  --danger-soft: #f6e1dd;\n  --success: #5a8a4d;\n  --success-soft: #e3eedb;\n\n  --font-ar: \"Tajawal\", \"Noto Naskh Arabic\", \"Segoe UI\", system-ui, sans-serif;\n  --font-mono: \"JetBrains Mono\", \"IBM Plex Mono\", ui-monospace, monospace;\n}\n\nhtml, body {\n  background: var(--bg);\n  color: var(--ink);\n  font-family: var(--font-ar);\n  direction: rtl;\n  line-height: 1.7;\n  -webkit-font-smoothing: antialiased;\n}\n\nbody {\n  min-height: 100vh;\n  background-image:\n    radial-gradient(circle at 12% 8%, rgba(107,142,78,0.05), transparent 40%),\n    radial-gradient(circle at 88% 92%, rgba(201,123,80,0.05), transparent 45%);\n}\n\n.app {\n  max-width: 1180px;\n  margin: 0 auto;\n  padding: 36px 28px 80px;\n}\n\n/* ---------- Header ---------- */\n.masthead {\n  display: flex;\n  justify-content: space-between;\n  align-items: flex-start;\n  border-bottom: 1px solid var(--rule);\n  padding-bottom: 22px;\n  margin-bottom: 36px;\n}\n.masthead .title-wrap h1 {\n  font-size: 34px;\n  font-weight: 800;\n  color: var(--olive-deep);\n  letter-spacing: -0.5px;\n  line-height: 1.2;\n}\n.masthead .title-wrap .sub {\n  margin-top: 8px;\n  color: var(--ink-soft);\n  font-size: 16px;\n  font-weight: 500;\n}\n.masthead .crest {\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  font-size: 13px;\n  color: var(--olive-deep);\n  font-weight: 600;\n}\n.masthead .crest-mark {\n  width: 36px; height: 36px;\n  border: 1.5px solid var(--olive);\n  border-radius: 8px;\n  display: grid; place-items: center;\n  color: var(--olive-deep);\n}\n\n/* ---------- Stepper ---------- */\n.stepper {\n  display: flex;\n  gap: 8px;\n  margin-bottom: 28px;\n  flex-wrap: wrap;\n}\n.step-pill {\n  flex: 1 1 160px;\n  background: var(--paper);\n  border: 1px solid var(--rule);\n  border-radius: 10px;\n  padding: 12px 14px;\n  display: flex;\n  align-items: center;\n  gap: 10px;\n  cursor: pointer;\n  transition: all .25s ease;\n  font-size: 14px;\n  color: var(--ink-soft);\n}\n.step-pill:hover { border-color: var(--olive); color: var(--ink); }\n.step-pill.active {\n  background: var(--olive-deep);\n  border-color: var(--olive-deep);\n  color: #fff;\n}\n.step-pill .num {\n  width: 24px; height: 24px;\n  border-radius: 50%;\n  background: var(--olive-soft);\n  color: var(--olive-deep);\n  display: grid; place-items: center;\n  font-size: 12px; font-weight: 700;\n  flex-shrink: 0;\n}\n.step-pill.active .num {\n  background: rgba(255,255,255,0.2);\n  color: #fff;\n}\n.step-pill.done .num { background: var(--olive); color: #fff; }\n\n/* ---------- Section card ---------- */\n.section {\n  background: var(--paper);\n  border: 1px solid var(--rule);\n  border-radius: 14px;\n  padding: 36px 38px;\n  margin-bottom: 24px;\n  display: none;\n  animation: fadeIn .4s ease;\n}\n.section.active { display: block; }\n@keyframes fadeIn {\n  from { opacity: 0; transform: translateY(8px); }\n  to { opacity: 1; transform: translateY(0); }\n}\n\n.section h2 {\n  font-size: 24px;\n  color: var(--olive-deep);\n  font-weight: 800;\n  margin-bottom: 6px;\n  display: flex;\n  align-items: center;\n  gap: 12px;\n}\n.section h2::before {\n  content: \"\";\n  width: 4px;\n  height: 26px;\n  background: var(--olive);\n  border-radius: 2px;\n}\n.section .lead {\n  color: var(--ink-soft);\n  font-size: 16px;\n  margin-bottom: 28px;\n  max-width: 70ch;\n}\n\n/* ---------- Concept grid (Step 1) ---------- */\n.concept-grid {\n  display: grid;\n  grid-template-columns: 1.2fr 1fr;\n  gap: 28px;\n  align-items: stretch;\n}\n.concept-text p {\n  margin-bottom: 14px;\n  font-size: 16px;\n  color: var(--ink);\n}\n.term {\n  background: var(--olive-soft);\n  color: var(--olive-deep);\n  padding: 1px 8px;\n  border-radius: 4px;\n  font-weight: 700;\n}\n.equation-card {\n  background: linear-gradient(180deg, #fbf9f3 0%, #f3efe3 100%);\n  border: 1px solid var(--rule);\n  border-radius: 12px;\n  padding: 32px 24px;\n  text-align: center;\n  display: flex;\n  flex-direction: column;\n  justify-content: center;\n  position: relative;\n  overflow: hidden;\n}\n.equation-card .label {\n  font-size: 13px;\n  letter-spacing: 1px;\n  color: var(--muted);\n  margin-bottom: 8px;\n  font-weight: 600;\n}\n.equation-card .eq {\n  font-family: var(--font-mono);\n  font-size: 38px;\n  color: var(--ink);\n  letter-spacing: 1px;\n  margin: 6px 0 14px;\n  direction: ltr;\n}\n.equation-card .eq .v { color: var(--olive-deep); font-weight: 700; }\n.equation-card .eq .h { color: var(--terracotta); font-weight: 700; }\n.equation-card .eq .s { color: var(--blue); font-weight: 700; }\n.equation-card .legend {\n  display: flex;\n  justify-content: center;\n  gap: 18px;\n  font-size: 13px;\n  color: var(--ink-soft);\n  flex-wrap: wrap;\n  margin-top: 6px;\n}\n.equation-card .legend span b { font-weight: 700; }\n.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-left: 6px; vertical-align: middle; }\n.dot.g { background: var(--olive-deep); }\n.dot.h { background: var(--terracotta); }\n.dot.s { background: var(--blue); }\n\n/* ---------- Sign-meaning rows ---------- */\n.signs {\n  margin-top: 28px;\n  display: grid;\n  grid-template-columns: repeat(3, 1fr);\n  gap: 14px;\n}\n.sign-card {\n  border: 1px solid var(--rule);\n  border-radius: 10px;\n  padding: 18px;\n  background: #fbfaf6;\n  transition: all .25s ease;\n}\n.sign-card:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(0,0,0,0.04); }\n.sign-card .badge {\n  display: inline-block;\n  font-family: var(--font-mono);\n  font-size: 14px;\n  padding: 3px 10px;\n  border-radius: 6px;\n  margin-bottom: 10px;\n  font-weight: 700;\n  direction: ltr;\n}\n.sign-card.neg .badge { background: var(--success-soft); color: var(--success); }\n.sign-card.pos .badge { background: var(--danger-soft); color: var(--danger); }\n.sign-card.zero .badge { background: var(--rule); color: var(--ink-soft); }\n.sign-card h4 { font-size: 16px; margin-bottom: 4px; }\n.sign-card p { font-size: 14px; color: var(--ink-soft); }\n\n/* ---------- Lab simulator (Step 2) ---------- */\n.lab {\n  display: grid;\n  grid-template-columns: 1fr 1fr;\n  gap: 28px;\n  align-items: stretch;\n}\n.lab-stage {\n  background: linear-gradient(180deg, #f3efe3 0%, #ebe6d6 100%);\n  border: 1px solid var(--rule);\n  border-radius: 12px;\n  padding: 24px;\n  position: relative;\n  min-height: 460px;\n  overflow: hidden;\n}\n.lab-stage .bench {\n  position: absolute;\n  bottom: 0; left: 0; right: 0;\n  height: 24px;\n  background: linear-gradient(180deg, #b8a98a 0%, #8a7a5d 100%);\n}\n.beaker {\n  position: absolute;\n  bottom: 24px;\n  left: 50%;\n  transform: translateX(-50%);\n  width: 200px;\n  height: 280px;\n}\n.beaker svg { width: 100%; height: 100%; overflow: visible; }\n.particle {\n  position: absolute;\n  width: 8px; height: 8px;\n  border-radius: 50%;\n  pointer-events: none;\n}\n.thermometer {\n  position: absolute;\n  top: 24px; right: 24px;\n  background: rgba(255,255,255,0.85);\n  border: 1px solid var(--rule);\n  border-radius: 10px;\n  padding: 12px 14px;\n  font-size: 13px;\n  min-width: 130px;\n  backdrop-filter: blur(4px);\n}\n.thermometer .t-val {\n  font-family: var(--font-mono);\n  font-size: 22px;\n  color: var(--terracotta);\n  font-weight: 700;\n}\n.verdict-tag {\n  position: absolute;\n  top: 24px; left: 24px;\n  background: rgba(255,255,255,0.92);\n  border: 1px solid var(--rule);\n  border-radius: 10px;\n  padding: 10px 14px;\n  font-size: 13px;\n  backdrop-filter: blur(4px);\n}\n.verdict-tag .v-state {\n  font-weight: 700;\n  font-size: 15px;\n  margin-top: 2px;\n}\n.verdict-tag.spontaneous .v-state { color: var(--success); }\n.verdict-tag.nonspontaneous .v-state { color: var(--danger); }\n.verdict-tag.equilibrium .v-state { color: var(--gold); }\n\n/* ---------- Controls ---------- */\n.controls {\n  background: #fbfaf6;\n  border: 1px solid var(--rule);\n  border-radius: 12px;\n  padding: 22px;\n}\n.controls h3 {\n  font-size: 16px;\n  margin-bottom: 18px;\n  color: var(--ink);\n  display: flex; align-items: center; gap: 8px;\n}\n.controls h3 .pip { width: 6px; height: 6px; background: var(--olive); border-radius: 50%; }\n\n.slider-row { margin-bottom: 22px; }\n.slider-row .row-head {\n  display: flex; justify-content: space-between; align-items: baseline;\n  margin-bottom: 8px;\n}\n.slider-row .lab-name { font-weight: 700; font-size: 14px; }\n.slider-row .lab-val {\n  font-family: var(--font-mono);\n  font-size: 14px;\n  background: #fff;\n  border: 1px solid var(--rule);\n  padding: 2px 8px;\n  border-radius: 5px;\n  direction: ltr;\n}\n.slider-row .lab-name.h { color: var(--terracotta); }\n.slider-row .lab-name.s { color: var(--blue); }\n.slider-row .lab-name.t { color: var(--ink); }\n.slider-row .desc {\n  font-size: 12px; color: var(--muted); margin-top: 4px;\n}\ninput[type=\"range\"] {\n  -webkit-appearance: none; appearance: none;\n  width: 100%; height: 4px;\n  background: var(--rule);\n  border-radius: 2px;\n  outline: none;\n  direction: ltr;\n}\ninput[type=\"range\"]::-webkit-slider-thumb {\n  -webkit-appearance: none;\n  width: 18px; height: 18px;\n  background: var(--paper);\n  border: 2px solid var(--olive-deep);\n  border-radius: 50%;\n  cursor: pointer;\n  transition: transform .15s ease;\n}\ninput[type=\"range\"]::-webkit-slider-thumb:hover { transform: scale(1.15); }\ninput[type=\"range\"]::-moz-range-thumb {\n  width: 18px; height: 18px;\n  background: var(--paper);\n  border: 2px solid var(--olive-deep);\n  border-radius: 50%;\n  cursor: pointer;\n}\n\n/* ---------- Live readout ---------- */\n.readout {\n  margin-top: 18px;\n  padding: 16px;\n  border-radius: 10px;\n  background: #fff;\n  border: 1px solid var(--rule);\n}\n.readout .row-eq {\n  font-family: var(--font-mono);\n  font-size: 18px;\n  text-align: center;\n  direction: ltr;\n  padding: 8px 0;\n  border-bottom: 1px dashed var(--rule);\n  margin-bottom: 12px;\n}\n.readout .row-eq .num { font-weight: 700; }\n.readout .delta-g {\n  font-family: var(--font-mono);\n  font-size: 28px;\n  text-align: center;\n  font-weight: 700;\n  direction: ltr;\n}\n.readout .delta-g.neg { color: var(--success); }\n.readout .delta-g.pos { color: var(--danger); }\n.readout .delta-g.zero { color: var(--gold); }\n.readout .units { font-size: 13px; color: var(--muted); text-align: center; margin-top: 4px; }\n\n.preset-row {\n  display: flex; gap: 8px; flex-wrap: wrap;\n  margin-top: 14px;\n}\n.preset {\n  flex: 1 1 0;\n  background: #fff;\n  border: 1px solid var(--rule);\n  border-radius: 8px;\n  padding: 8px 10px;\n  font-family: var(--font-ar);\n  font-size: 12px;\n  cursor: pointer;\n  transition: all .2s ease;\n  color: var(--ink-soft);\n}\n.preset:hover { border-color: var(--olive); color: var(--olive-deep); }\n\n/* ---------- Quiz ---------- */\n.quiz-progress {\n  display: flex; gap: 6px; margin-bottom: 24px;\n}\n.quiz-progress .qpip {\n  flex: 1; height: 4px;\n  background: var(--rule);\n  border-radius: 2px;\n  transition: background .3s;\n}\n.quiz-progress .qpip.active { background: var(--olive); }\n.quiz-progress .qpip.correct { background: var(--success); }\n.quiz-progress .qpip.wrong { background: var(--danger); }\n\n.q-card {\n  background: #fbfaf6;\n  border: 1px solid var(--rule);\n  border-radius: 12px;\n  padding: 28px;\n}\n.q-card .q-num {\n  font-family: var(--font-mono);\n  font-size: 13px;\n  color: var(--muted);\n  margin-bottom: 6px;\n  direction: ltr; text-align: right;\n}\n.q-card .q-text {\n  font-size: 18px;\n  font-weight: 600;\n  margin-bottom: 6px;\n  line-height: 1.6;\n}\n.q-card .q-context {\n  font-size: 14px;\n  color: var(--ink-soft);\n  margin-bottom: 18px;\n  padding: 10px 14px;\n  background: #fff;\n  border-right: 3px solid var(--olive);\n  border-radius: 6px;\n}\n.q-card .q-context .mono { font-family: var(--font-mono); direction: ltr; display: inline-block; }\n\n.options { display: flex; flex-direction: column; gap: 10px; }\n.option {\n  background: #fff;\n  border: 1.5px solid var(--rule);\n  border-radius: 10px;\n  padding: 14px 18px;\n  cursor: pointer;\n  font-family: var(--font-ar);\n  font-size: 15px;\n  text-align: right;\n  transition: all .2s ease;\n  display: flex; align-items: center; gap: 12px;\n}\n.option:hover:not(:disabled) { border-color: var(--olive); transform: translateX(-2px); }\n.option .opt-letter {\n  width: 26px; height: 26px;\n  border-radius: 50%;\n  background: var(--olive-soft);\n  color: var(--olive-deep);\n  display: grid; place-items: center;\n  font-size: 13px; font-weight: 700;\n  flex-shrink: 0;\n}\n.option.correct { border-color: var(--success); background: var(--success-soft); }\n.option.correct .opt-letter { background: var(--success); color: #fff; }\n.option.wrong { border-color: var(--danger); background: var(--danger-soft); }\n.option.wrong .opt-letter { background: var(--danger); color: #fff; }\n.option:disabled { cursor: default; }\n\n.feedback {\n  margin-top: 16px;\n  padding: 14px 18px;\n  border-radius: 10px;\n  font-size: 14px;\n  line-height: 1.7;\n  display: none;\n  animation: fadeIn .3s ease;\n}\n.feedback.show { display: block; }\n.feedback.correct { background: var(--success-soft); color: var(--success); border-right: 3px solid var(--success); }\n.feedback.wrong { background: var(--danger-soft); color: var(--danger); border-right: 3px solid var(--danger); }\n.feedback b { display: block; margin-bottom: 4px; font-size: 15px; }\n\n.quiz-nav {\n  display: flex; justify-content: space-between; margin-top: 22px;\n  align-items: center;\n}\n.btn {\n  background: var(--olive-deep);\n  color: #fff;\n  border: none;\n  padding: 11px 24px;\n  border-radius: 8px;\n  font-family: var(--font-ar);\n  font-size: 14px;\n  font-weight: 600;\n  cursor: pointer;\n  transition: all .2s ease;\n}\n.btn:hover:not(:disabled) { background: var(--olive); }\n.btn:disabled { opacity: 0.4; cursor: not-allowed; }\n.btn.ghost {\n  background: transparent;\n  color: var(--ink-soft);\n  border: 1px solid var(--rule);\n}\n.btn.ghost:hover:not(:disabled) { color: var(--ink); border-color: var(--ink-soft); background: transparent; }\n\n/* ---------- Result ---------- */\n.result {\n  text-align: center;\n  padding: 40px 24px;\n}\n.result .score-ring {\n  width: 140px; height: 140px;\n  margin: 0 auto 20px;\n  position: relative;\n}\n.result .score-ring .num {\n  position: absolute; inset: 0;\n  display: grid; place-items: center;\n  font-size: 38px; font-weight: 800;\n  color: var(--olive-deep);\n  font-family: var(--font-mono);\n}\n.result h3 { font-size: 22px; margin-bottom: 8px; }\n.result p { color: var(--ink-soft); max-width: 50ch; margin: 0 auto 20px; }\n\n/* ---------- Footer ---------- */\n.foot-nav {\n  display: flex; justify-content: space-between;\n  margin-top: 8px;\n}\n\n/* ---------- Responsive ---------- */\n@media (max-width: 880px) {\n  .concept-grid, .lab { grid-template-columns: 1fr; }\n  .signs { grid-template-columns: 1fr; }\n  .section { padding: 24px 20px; }\n  .masthead .title-wrap h1 { font-size: 26px; }\n}\n<\u002Fstyle>\n  \n<\u002Fhead>\n<body>\n  <div class=\"app\" data-screen-label=\"Gibbs Free Energy Lesson\">\n\n    <!-- Header -->\n    <header class=\"masthead\">\n      <div class=\"title-wrap\">\n        <h1>تجربة الطاقة الحرة <span style=\"color:var(--ink);\">(ΔG)<\u002Fspan><\u002Fh1>\n        <div class=\"sub\">طاقة كِبس الحرة — تجربة تعليمية تفاعلية للمرحلة الثانوية<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"crest\">\n        <div class=\"crest-mark\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\">\n            <path d=\"M12 3v18M5 8h14M5 16h14\"><\u002Fpath>\n          <\u002Fsvg>\n        <\u002Fdiv>\n        <div>المختبر الافتراضي<br><span style=\"color:var(--muted);font-weight:500;\">الوحدة: الثرموداينميكا<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fheader>\n\n    <!-- Stepper -->\n    <nav class=\"stepper\" aria-label=\"مراحل التجربة\">\n      <div class=\"step-pill active\"><span class=\"num\">1<\u002Fspan><span>المفهوم والقانون<\u002Fspan><\u002Fdiv>\n      <div class=\"step-pill\"><span class=\"num\">2<\u002Fspan><span>المختبر الافتراضي<\u002Fspan><\u002Fdiv>\n      <div class=\"step-pill\"><span class=\"num\">3<\u002Fspan><span>دلالات إشارة ΔG<\u002Fspan><\u002Fdiv>\n      <div class=\"step-pill\"><span class=\"num\">4<\u002Fspan><span>التقويم التفاعلي<\u002Fspan><\u002Fdiv>\n    <\u002Fnav>\n\n    <!-- ============================================ -->\n    <!-- Step 1: Concept                              -->\n    <!-- ============================================ -->\n    <section class=\"section active\" data-screen-label=\"01 Concept\">\n      <h2>ما هي طاقة كبس الحرة؟<\u002Fh2>\n      <p class=\"lead\">المرحلة الأولى من التجربة: نتعرّف على المفهوم والمعادلة الأساسية التي تحكم تلقائية التفاعلات الكيميائية والتغيرات الفيزيائية.<\u002Fp>\n\n      <div class=\"concept-grid\">\n        <div class=\"concept-text\">\n          <p>\n            <span class=\"term\">طاقة كبس الحرة (ΔG)<\u002Fspan> هي دالة حالة ثرموداينميكية تتيح لنا التنبؤ بتلقائية التفاعل، تمثّل الطاقة العظمى التي يمكن الحصول عليها من قياس التغير في\n            <span class=\"term\">الانثالبي (ΔH)<\u002Fspan>\n            والتغير في\n            <span class=\"term\">الانتروبي (ΔS)<\u002Fspan>.\n          <\u002Fp>\n          <p>\n            بمعنى آخر: ΔG تجمع بين «اتجاه الطاقة» الذي يصفه ΔH، و«اتجاه الفوضى» الذي يصفه ΔS، لتعطينا قيمة واحدة تخبرنا — هل التفاعل سيحدث من تلقاء نفسه أم لا.\n          <\u002Fp>\n          <p>\n            في الظروف الاعتيادية (T = 298 K، P = 1 atm) نُسمّي هذه الكمية <span class=\"term\">طاقة كبس الحرة القياسية للتفاعل (°ΔG)<\u002Fspan>.\n          <\u002Fp>\n        <\u002Fdiv>\n\n        <div class=\"equation-card\">\n          <div class=\"label\">قانون التغير في طاقة كبس الحرة<\u002Fdiv>\n          <div class=\"eq\">\n            <span class=\"v\">ΔG<\u002Fspan> = <span class=\"h\">ΔH<\u002Fspan> − T·<span class=\"s\">ΔS<\u002Fspan>\n          <\u002Fdiv>\n          <div class=\"legend\">\n            <span><b>ΔG<\u002Fb><span class=\"dot g\"><\u002Fspan> الطاقة الحرة<\u002Fspan>\n            <span><b>ΔH<\u002Fb><span class=\"dot h\"><\u002Fspan> الانثالبي<\u002Fspan>\n            <span><b>T<\u002Fb> درجة الحرارة<\u002Fspan>\n            <span><b>ΔS<\u002Fb><span class=\"dot s\"><\u002Fspan> الانتروبي<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"margin-top:18px; padding-top:16px; border-top:1px dashed var(--rule); font-size:13px; color:var(--ink-soft); direction:rtl;\">\n            T مقاسة بـ <b>كلفن (K)<\u002Fb> · ΔH بـ <b>kJ/mol<\u002Fb> · ΔS بـ <b>J/mol·K<\u002Fb>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"signs\">\n        <div class=\"sign-card neg\">\n          <div class=\"badge\">ΔG &lt; 0<\u002Fdiv>\n          <h4>قيمة سالبة<\u002Fh4>\n          <p>التفاعل أو التغير الفيزيائي <b>تلقائي<\u002Fb> — يحدث من تلقاء نفسه دون الحاجة إلى طاقة خارجية مستمرة.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sign-card pos\">\n          <div class=\"badge\">ΔG &gt; 0<\u002Fdiv>\n          <h4>قيمة موجبة<\u002Fh4>\n          <p>التفاعل أو التغير الفيزيائي <b>غير تلقائي<\u002Fb> — يحتاج إلى طاقة خارجية لإحداثه.<\u002Fp>\n        <\u002Fdiv>\n        <div class=\"sign-card zero\">\n          <div class=\"badge\">ΔG = 0<\u002Fdiv>\n          <h4>قيمة تساوي صفر<\u002Fh4>\n          <p>النظام في <b>حالة اتزان<\u002Fb> — السرعة الأمامية للتفاعل تساوي السرعة العكسية.<\u002Fp>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"foot-nav\" style=\"margin-top:34px;\">\n        <span><\u002Fspan>\n        <button class=\"btn foot-next\">انتقل إلى المختبر الافتراضي ←<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================ -->\n    <!-- Step 2: Lab simulator                        -->\n    <!-- ============================================ -->\n    <section class=\"section\" data-screen-label=\"02 Lab\">\n      <h2>المختبر الافتراضي: ذوبان نترات الأمونيوم<\u002Fh2>\n      <p class=\"lead\">عدّل قيم ΔH و ΔS ودرجة الحرارة T، وراقب كيف تتغير قيمة ΔG ومدى تلقائية التفاعل لحظيًا. التجربة المرجعية: <b>ذوبان نترات الأمونيوم في الماء<\u002Fb> — عملية تعتمد على الطاقة والانتروبي.<\u002Fp>\n\n      <div class=\"lab\">\n        <!-- Stage -->\n        <div class=\"lab-stage\">\n          <div class=\"verdict-tag\" id=\"verdict-tag\">\n            <div style=\"font-size:11px; color:var(--muted); letter-spacing:1px;\">الحالة الحالية<\u002Fdiv>\n            <div class=\"v-state\" id=\"verdict-state\">تفاعل تلقائي<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"thermometer\">\n            <div style=\"font-size:11px; color:var(--muted); letter-spacing:1px; margin-bottom:4px;\">درجة الحرارة<\u002Fdiv>\n            <div class=\"t-val\" id=\"therm-val\">298 K<\u002Fdiv>\n            <div style=\"font-size:12px; color:var(--ink-soft);\" id=\"therm-c\">25 °C<\u002Fdiv>\n            <div style=\"margin-top:10px; height:60px; width:8px; background:#eee; border-radius:4px; position:relative; overflow:hidden; margin-right:auto; margin-left:0;\">\n              <div id=\"therm-fill\" style=\"position:absolute; bottom:0; left:0; right:0; background:linear-gradient(180deg, var(--terracotta), #e8a878); border-radius:4px; transition:height .4s ease;\"><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"beaker\">\n            <svg viewBox=\"0 0 200 280\" preserveAspectRatio=\"none\">\n              <!-- beaker outline -->\n              <defs>\n                <linearGradient id=\"liq\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n                  <stop offset=\"0%\" stop-color=\"#cfe0d2\" stop-opacity=\"0.9\"><\u002Fstop>\n                  <stop offset=\"100%\" stop-color=\"#9bb89e\" stop-opacity=\"0.95\"><\u002Fstop>\n                <\u002FlinearGradient>\n              <\u002Fdefs>\n              <!-- spout -->\n              <path d=\"M 30 20 L 30 5 L 50 5\" fill=\"none\" stroke=\"#888\" stroke-width=\"2\"><\u002Fpath>\n              <!-- container -->\n              <path d=\"M 20 20 L 20 260 Q 20 270 30 270 L 170 270 Q 180 270 180 260 L 180 20\" fill=\"rgba(255,255,255,0.4)\" stroke=\"#666\" stroke-width=\"2.5\" stroke-linecap=\"round\"><\u002Fpath>\n              <!-- liquid -->\n              <path d=\"M 22 80 L 22 258 Q 22 268 32 268 L 168 268 Q 178 268 178 258 L 178 80 Z\" fill=\"url(#liq)\"><\u002Fpath>\n              <!-- liquid surface -->\n              <ellipse cx=\"100\" cy=\"80\" rx=\"78\" ry=\"6\" fill=\"#b3cdb6\" opacity=\"0.6\"><\u002Fellipse>\n              <!-- tick marks -->\n              <g stroke=\"#666\" stroke-width=\"1\" opacity=\"0.5\">\n                <line x1=\"20\" y1=\"100\" x2=\"32\" y2=\"100\"><\u002Fline>\n                <line x1=\"20\" y1=\"140\" x2=\"32\" y2=\"140\"><\u002Fline>\n                <line x1=\"20\" y1=\"180\" x2=\"32\" y2=\"180\"><\u002Fline>\n                <line x1=\"20\" y1=\"220\" x2=\"32\" y2=\"220\"><\u002Fline>\n              <\u002Fg>\n              <text x=\"38\" y=\"103\" font-size=\"9\" fill=\"#666\" font-family=\"monospace\">100<\u002Ftext>\n              <text x=\"38\" y=\"143\" font-size=\"9\" fill=\"#666\" font-family=\"monospace\">200<\u002Ftext>\n              <text x=\"38\" y=\"183\" font-size=\"9\" fill=\"#666\" font-family=\"monospace\">300<\u002Ftext>\n              <text x=\"38\" y=\"223\" font-size=\"9\" fill=\"#666\" font-family=\"monospace\">400<\u002Ftext>\n              <!-- label -->\n              <text x=\"100\" y=\"295\" font-size=\"11\" fill=\"#555\" text-anchor=\"middle\" font-family=\"Tajawal\">NH₄NO₃ + H₂O<\u002Ftext>\n            <\u002Fsvg>\n            <!-- particle layer -->\n            <div id=\"beaker-particles\" style=\"position:absolute; left:20px; top:80px; width:160px; height:200px; pointer-events:none;\"><\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"bench\"><\u002Fdiv>\n        <\u002Fdiv>\n\n        <!-- Controls -->\n        <div class=\"controls\">\n          <h3><span class=\"pip\"><\u002Fspan> لوحة التحكم بالمتغيرات<\u002Fh3>\n\n          <div class=\"slider-row\">\n            <div class=\"row-head\">\n              <span class=\"lab-name h\">ΔH — التغير في الانثالبي<\u002Fspan>\n              <span class=\"lab-val\"><span id=\"lab-h\">25.7<\u002Fspan> kJ/mol<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"sl-h\" min=\"-200\" max=\"200\" step=\"0.5\" value=\"25.7\">\n            <div class=\"desc\">القيمة السالبة: تفاعل طارد للحرارة · القيمة الموجبة: تفاعل ماص للحرارة<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"slider-row\">\n            <div class=\"row-head\">\n              <span class=\"lab-name s\">ΔS — التغير في الانتروبي<\u002Fspan>\n              <span class=\"lab-val\"><span id=\"lab-s\">108.7<\u002Fspan> J/mol·K<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"sl-s\" min=\"-300\" max=\"300\" step=\"0.5\" value=\"108.7\">\n            <div class=\"desc\">القيمة الموجبة: زيادة في الفوضى · القيمة السالبة: نقصان في الفوضى<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"slider-row\">\n            <div class=\"row-head\">\n              <span class=\"lab-name t\">T — درجة الحرارة المطلقة<\u002Fspan>\n              <span class=\"lab-val\"><span id=\"lab-t\">298<\u002Fspan> K<\u002Fspan>\n            <\u002Fdiv>\n            <input type=\"range\" id=\"sl-t\" min=\"250\" max=\"450\" step=\"1\" value=\"298\">\n            <div class=\"desc\">الظروف الاعتيادية: T = 298 K (25 °C) و P = 1 atm<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"readout\">\n            <div class=\"row-eq\">\n              ΔG = <span class=\"num\" id=\"out-h\">+25.70<\u002Fspan> − ( <span class=\"num\" id=\"out-t\">298<\u002Fspan> × <span class=\"num\" id=\"out-s\">+108.70<\u002Fspan>/1000 )\n            <\u002Fdiv>\n            <div class=\"row-eq\" style=\"border:none; margin-bottom:6px; font-size:14px; color:var(--muted);\">\n              ΔG = ΔH − TΔS  =  ΔH − <span id=\"out-ts\">+32.39<\u002Fspan>\n            <\u002Fdiv>\n            <div class=\"delta-g neg\" id=\"out-g\">−6.69<\u002Fdiv>\n            <div class=\"units\">kJ/mol<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div class=\"preset-row\">\n            <button class=\"preset\" data-preset=\"nh4no3\">ذوبان NH₄NO₃<\u002Fbutton>\n            <button class=\"preset\" data-preset=\"combustion\">احتراق الميثان<\u002Fbutton>\n            <button class=\"preset\" data-preset=\"melting\">انصهار الجليد<\u002Fbutton>\n            <button class=\"preset\" data-preset=\"photosyn\">التركيب الضوئي<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"foot-nav\">\n        <button class=\"btn ghost foot-prev\">→ السابق<\u002Fbutton>\n        <button class=\"btn foot-next\">انتقل إلى دلالات ΔG ←<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================ -->\n    <!-- Step 3: Sign explorer                        -->\n    <!-- ============================================ -->\n    <section class=\"section\" data-screen-label=\"03 Signs\">\n      <h2>كيف تستخدم ΔG للتنبؤ بحدوث التفاعل؟<\u002Fh2>\n      <p class=\"lead\">إشارة قيمة ΔG هي المفتاح. القانون يربط بين إشارتي ΔH و ΔS ودرجة الحرارة T، فينتج عن ذلك أربع حالات أساسية يمكن استكشافها.<\u002Fp>\n\n      <div style=\"display:grid; grid-template-columns:repeat(2, 1fr); gap:18px;\">\n\n        <div class=\"sign-card neg\" style=\"padding:22px;\">\n          <div class=\"badge\">ΔH &lt; 0  ·  ΔS &gt; 0<\u002Fdiv>\n          <h4 style=\"margin-bottom:6px;\">تفاعل تلقائي عند جميع درجات الحرارة<\u002Fh4>\n          <p>كلا الحدّين يعملان لصالح التلقائية: حد ΔH سالب، وحد −TΔS سالب أيضًا، فتكون ΔG سالبة دائمًا.<\u002Fp>\n          <div style=\"margin-top:10px; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); direction:ltr;\">\n            مثال: احتراق الميثان CH₄\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sign-card pos\" style=\"padding:22px;\">\n          <div class=\"badge\">ΔH &gt; 0  ·  ΔS &lt; 0<\u002Fdiv>\n          <h4 style=\"margin-bottom:6px;\">تفاعل غير تلقائي عند جميع درجات الحرارة<\u002Fh4>\n          <p>كلا الحدّين يعملان ضد التلقائية: حد ΔH موجب، وحد −TΔS موجب أيضًا، فتكون ΔG موجبة دائمًا.<\u002Fp>\n          <div style=\"margin-top:10px; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); direction:ltr;\">\n            مثال: التركيب الضوئي\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sign-card\" style=\"padding:22px; border-color:var(--gold); background:#fdf7e7;\">\n          <div class=\"badge\" style=\"background:#f6e9bd; color:#9c7d1c;\">ΔH &gt; 0  ·  ΔS &gt; 0<\u002Fdiv>\n          <h4 style=\"margin-bottom:6px;\">تلقائي عند درجات الحرارة المرتفعة<\u002Fh4>\n          <p>عند T مرتفعة يصبح حد TΔS أكبر من ΔH فتنقلب ΔG إلى السالب. هذه هي حالة <b>ذوبان نترات الأمونيوم<\u002Fb> في الماء.<\u002Fp>\n          <div style=\"margin-top:10px; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); direction:ltr;\">\n            مثال: NH₄NO₃ → NH₄⁺ + NO₃⁻\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div class=\"sign-card\" style=\"padding:22px; border-color:var(--blue); background:var(--blue-soft);\">\n          <div class=\"badge\" style=\"background:#cfdcef; color:var(--blue);\">ΔH &lt; 0  ·  ΔS &lt; 0<\u002Fdiv>\n          <h4 style=\"margin-bottom:6px;\">تلقائي عند درجات الحرارة المنخفضة<\u002Fh4>\n          <p>عند T منخفضة يكون حد TΔS صغيرًا، فيغلب ΔH السالب، وتكون ΔG سالبة.<\u002Fp>\n          <div style=\"margin-top:10px; font-family:var(--font-mono); font-size:13px; color:var(--ink-soft); direction:ltr;\">\n            مثال: تجمّد الماء\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"margin-top:28px; padding:20px 24px; background:var(--olive-soft); border-radius:12px; border-right:3px solid var(--olive-deep);\">\n        <div style=\"font-weight:700; color:var(--olive-deep); margin-bottom:6px;\">ملخص للحفظ<\u002Fdiv>\n        <div style=\"color:var(--ink-soft); font-size:15px;\">\n          إشارة ΔG هي المعيار الوحيد للحكم على تلقائية التفاعل. أما درجة الحرارة T فهي «المفتاح» الذي يحوّل بعض التفاعلات من غير تلقائية إلى تلقائية والعكس، وذلك عندما يكون لـ ΔH و ΔS الإشارة نفسها.\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"foot-nav\">\n        <button class=\"btn ghost foot-prev\">→ السابق<\u002Fbutton>\n        <button class=\"btn foot-next\">ابدأ التقويم التفاعلي ←<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ============================================ -->\n    <!-- Step 4: Quiz                                 -->\n    <!-- ============================================ -->\n    <section class=\"section\" data-screen-label=\"04 Quiz\">\n      <h2>التقويم التفاعلي<\u002Fh2>\n      <p class=\"lead\">ثلاثة أسئلة لقياس فهمك لمفهوم طاقة كِبس الحرة ΔG ودلالات إشارتها وعلاقتها بـ ΔH و ΔS و T.<\u002Fp>\n\n      <div class=\"quiz-progress\">\n        <div class=\"qpip active\"><\u002Fdiv>\n        <div class=\"qpip\"><\u002Fdiv>\n        <div class=\"qpip\"><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"q-card\" id=\"quiz-card\"><\u002Fdiv>\n\n      <div class=\"foot-nav\" style=\"margin-top:24px;\">\n        <button class=\"btn ghost foot-prev\">→ العودة للدرس<\u002Fbutton>\n        <span><\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n  <\u002Fdiv>\n\n  <script src=\"b53bc284-bd91-40ee-b0fe-8afac5ed542d\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
